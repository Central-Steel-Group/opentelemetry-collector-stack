receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "[::]:4317"
      http:
        endpoint: "[::]:4318"

exporters:
  prometheus:
    endpoint: "[::]:9464"
  otlp_http:
    endpoint: "http://${TEMPO_PRIVATE_DOMAIN}:4318"

connectors:
  span_metrics:
    namespace: traces.span.metrics

    # Group generated metrics by stable service identity rather than
    # by every resource attribute, such as Gunicorn worker instance IDs.
    #
    # This controls the resource-metrics grouping key. It does not copy
    # this attribute onto the generated metric as an additional dimension.
    resource_metrics_key_attributes:
      - service.name

    # Additional span attributes to include beyond the connector's
    # standard dimensions:
    #   service.name
    #   span.name
    #   span.kind
    #   status.code
    dimensions:
      - name: http.status_code
      - name: http.method

processors:
  batch:
  transform:
    metric_statements:
      - context: datapoint
        statements:
          # For ordinary application metrics received through OTLP,
          # copy selected resource attributes onto each metric datapoint.
          - set(attributes["worker"], resource.attributes["worker"]) where IsMatch(metric.name, "^traces\\.span\\.metrics") == false and resource.attributes["worker"] != nil

          - set(attributes["service_instance_id"], resource.attributes["service.instance.id"]) where IsMatch(metric.name, "^traces\\.span\\.metrics") == false and resource.attributes["service.instance.id"] != nil

          - set(attributes["service_name"], resource.attributes["service.name"]) where IsMatch(metric.name, "^traces\\.span\\.metrics") == false and resource.attributes["service.name"] != nil

          # The span-metrics connector emits service.name as one of its
          # standard metric dimensions. Rename it to service_name so the
          # Prometheus label matches your existing queries and dashboards.
          - set(attributes["service_name"], attributes["service.name"]) where IsMatch(metric.name, "^traces\\.span\\.metrics") == true and attributes["service.name"] != nil

          - delete_key(attributes, "service.name") where IsMatch(metric.name, "^traces\\.span\\.metrics") == true

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp_http
        - span_metrics

    metrics:
      receivers:
        - otlp
        - span_metrics
      processors:
        - transform
        - batch
      exporters:
        - prometheus
